{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container py-4">
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-3">Login</h3>
            <form action="{% url 'accounts:login' %}" method="post">
                {% csrf_token %}
        {% bootstrap_form form %}
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        </div>
    </div>
</div>
{% endblock content %}
