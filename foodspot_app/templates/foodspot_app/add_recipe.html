{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}

<h3>Create a recipe {% if category %} for {{ category.name }} {% endif %}</h3>

<div>
    
    <form action="" method="post">

        {% csrf_token %}
        {% bootstrap_form form %}
        {%bootstrap_button button_type="submit" content="Create recipe"%}
    </form>
</div>
{% endblock content %}
